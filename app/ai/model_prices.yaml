# belgeee — yerleşik model fiyat tablosu (PRD 13.1.1; PLAN.md §C77, §D49).
#
# Birim: USD / 1 milyon token, standart (kısa bağlam, Batch'siz, bölge ekisiz) fiyat.
# Kaynak: benchlm.ai sağlayıcı fiyat sayfaları, "Last synced" 18 Eylül 2026; sayfalar 21 Eylül 2026'da
# okundu ve bu dosyaya elle aktarıldı. Fiyat sağlayıcıya aittir ve değişir: güncellemek için bu
# dosyayı düzenleyin (`synced` tarihini de). `.env`'deki `AI_MODEL_PRICES` aynı model için bu
# tablonun önüne geçer — tek bir modeli düzeltmek için dosyaya dokunmak gerekmez.
#
# Anahtar, uygulamanın olaya yazdığı model adıdır (`ANTHROPIC_MODEL` / `OPENAI_MODEL`). Eşleşme
# önce birebir, sonra sondaki tarih eki atılarak yapılır: `claude-haiku-4-5-20251001` →
# `claude-haiku-4-5`. `-pro`, `-mini` gibi ekler atılmaz (`gpt-5.5-pro` ≠ `gpt-5.5`).
#
# `id_source: page` — API model kimliği sayfada yazılı. `derived` — sayfa kimlik vermiyor ("—"),
# kimlik görünen addan sağlayıcının bilinen adlandırmasıyla türetildi. Kimliği belirsiz satırlar
# alınmadı: GPT-5.3 Instant, GPT-5.2 Instant; DeepSeek R1 ve V3 (kimlikleri `deepseek-reasoner` /
# `deepseek-chat` takma adlarının eski eşlemeleridir, takma adın son eşlemesi aşağıda).
#
# `cached_input_per_mtok` yalnız sayfanın yayımladığı yerde yazılıdır; yoksa önbellekten okunan
# token da standart girdi fiyatıyla hesaplanır (fazla gösterir, eksik göstermez).
# Tabloda olmayanlar: uzun bağlam fiyatı (OpenAI GPT-5.6 ve Gemini Pro'da istek büyüdükçe artar;
# bu uygulamanın sayfa isteği birkaç bin tokendir), önbellek yazma eki (Anthropic 1.25x/2x,
# GPT-5.6 1.25x), Batch indirimi, bölge ekleri, DeepSeek'in yoğun olmayan saat indirimi (tabloda
# yoğun saat fiyatı var — maliyet eksik gösterilmez).

