# Alembic yapılandırması (PRD 00.3.2).
# Bağlantı dizesi burada YAZILMAZ: alembic/env.py onu DATABASE_URL'den (app.config) okur.
# Kullanım: `alembic upgrade head` · yeni göç: `alembic revision --autogenerate -m "..."`

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s

[post_write_hooks]
# Üretilen göç dosyası kapıdaki ruff denetimini geçsin.
hooks = ruff_format, ruff_fix
ruff_fix.type = module
ruff_fix.module = ruff
ruff_fix.options = check --fix REVISION_SCRIPT_FILENAME
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
